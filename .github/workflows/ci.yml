# Runs scripts/ci.sh. All logic lives there; this file only prepares the runner.
# Manual only since 2026-10-18 (owner decision): the GitHub Actions minutes are exhausted, so pull
# requests are checked by a local `bash scripts/ci.sh` before merging (docs/runbooks/deploy.md,
# "Local deploy"). Kept for later; put `pull_request:` back under `on:` to check every PR again.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the docs check diffs against the base branch
      - uses: pnpm/action-setup@v6 # version from "packageManager" in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: bash scripts/ci.sh
        env:
          CI_BASE_REF: origin/${{ github.base_ref }}
