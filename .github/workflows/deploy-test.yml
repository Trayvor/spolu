# Deploys to the test environment, by hand only, for any branch or SHA.
# Manual only since 2026-10-18 (owner decision): the GitHub Actions minutes are exhausted, so test
# is deployed from the orchestrator's Mac with scripts/deploy-local.sh after a green local
# scripts/ci.sh (docs/runbooks/deploy.md, "Local deploy"). Kept for later (Jenkins replaces it);
# to deploy on every push to main again, put back under `on:`
#   push: { branches: [main], paths-ignore: ['docs/**', '**/*.md'] }
# Logic lives in scripts/ci.sh, scripts/build-image.sh and scripts/deploy.sh; this file only
# prepares the runner and passes settings in. Settings live in the "test" GitHub environment:
#   secrets TEST_SSH_KEY, TEST_ENV_FILE, optional TICKETS_API_KEY; variables DEPLOY_HOST, DEPLOY_USER, DOMAIN, IMAGE,
#   optional DEPLOY_KNOWN_HOSTS and REDIRECT_DOMAINS (old domains redirected to DOMAIN). See docs/runbooks/deploy.md.
name: Deploy test

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to deploy (empty = the branch selected above)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0 # the docs check diffs against main
      # The SHA tested here is the SHA the deploy job builds and deploys.
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6 # version from "packageManager" in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: bash scripts/ci.sh
        env:
          CI_BASE_REF: origin/main
      # Playwright's traces and page snapshots of a failed e2e test, to debug failures that only
      # happen on the runner.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: test
    permissions:
      contents: read
      packages: write
    steps:
      # Exactly the commit the ci job tested (github.sha is wrong when inputs.ref is set).
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.ci.outputs.sha }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      # Exposes the Actions cache credentials to "docker buildx build" (BUILDX_CACHE=gha).
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: bash scripts/build-image.sh "${{ needs.ci.outputs.sha }}"
        env:
          IMAGE: ${{ vars.IMAGE }}
          EXTRA_TAG: test
          BUILDX_CACHE: gha
      - name: Write deploy secrets to files
        run: |
          umask 077
          printf '%s\n' "$TEST_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$TEST_ENV_FILE" > "$RUNNER_TEMP/deploy.env"
        env:
          TEST_SSH_KEY: ${{ secrets.TEST_SSH_KEY }}
          TEST_ENV_FILE: ${{ secrets.TEST_ENV_FILE }}
      - run: bash scripts/deploy.sh test "${{ needs.ci.outputs.sha }}"
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ runner.temp }}/deploy_key
          DEPLOY_ENV_FILE: ${{ runner.temp }}/deploy.env
          DOMAIN: ${{ vars.DOMAIN }}
          REDIRECT_DOMAINS: ${{ vars.REDIRECT_DOMAINS }}
          MAIL_FROM_NAME: ${{ vars.MAIL_FROM_NAME }}
          IMAGE: ${{ vars.IMAGE }}
          TICKETS_API_KEY: ${{ secrets.TICKETS_API_KEY }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove deploy secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/deploy.env"
