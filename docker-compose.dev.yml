name: spolu
# Local development services: PostgreSQL and Mailpit (catches all outgoing email).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: spolu
      POSTGRES_PASSWORD: spolu
      POSTGRES_DB: spolu
    ports:
      - '5432:5432'
    volumes:
      - spolu-dev-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U spolu -d spolu']
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit
    environment:
      # The default keeps 500 messages and drops the oldest: parallel ci.sh runs send more than
      # that, and a login code could be gone before its e2e spec read it.
      MP_MAX_MESSAGES: '20000'
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  spolu-dev-pgdata:
