# Spolu on one server: app + PostgreSQL + Caddy (TLS) + nightly backup.
# Run from this directory with: docker compose --env-file .env up -d
# .env holds IMAGE, TAG, DOMAIN, REDIRECT_DOMAINS, POSTGRES_PASSWORD and the app settings (see test.env.example).

name: spolu # fixed project name so volumes never fork under another one

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

# Third-party images are pinned by digest (ADR 0037): a tag can be pushed again, a digest cannot,
# and `docker compose pull` on a deploy would otherwise fetch whatever the tag points at that day.
# The tag is only for people. To bump: `docker buildx imagetools inspect postgres:17` (or caddy:2),
# take its version and "Digest:" line, see docs/runbooks/deploy.md, "Image digests".
# A new PostgreSQL major (18) needs a dump and restore, never only a new tag.

services:
  app:
    image: ${IMAGE}:${TAG}
    env_file: .env
    environment:
      # Built from POSTGRES_PASSWORD, so .env needs no DATABASE_URL.
      DATABASE_URL: postgres://spolu:${POSTGRES_PASSWORD}@postgres:5432/spolu
      # ffmpeg runs in the media sandbox below (ADR 0048), reached over this socket.
      MEDIA_SANDBOX_SOCKET: /run/media/media.sock
    volumes:
      - files:/data/files
      - media_socket:/run/media
      # Teams with a certificate (docs/integrations/teams.md): the private key in ./secrets
      # (mode 600), read as TEAMS_CERT_PATH=/run/secrets/spolu/teams.pem.
      # - ./secrets:/run/secrets/spolu:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s # pg-boss waits for running jobs on shutdown
    logging: *logging
    # Node needs no Linux capabilities: it runs as the image's non-root user on port 3000.
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]

  # The media sandbox (ADR 0048): ffmpeg parses untrusted meeting uploads here, not in the app.
  # Same image, its own entry point. No env_file (no secrets), no network at all, no database,
  # no stored files: the app streams each input over the socket in media_socket and gets the
  # output back. A crafted file that takes over ffmpeg finds nothing to read and nowhere to send.
  media:
    image: ${IMAGE}:${TAG}
    command: ['node', 'server/media-sandbox.js']
    environment:
      MEDIA_SOCKET: /run/media/media.sock
      MEDIA_WORK_DIR: /work
    network_mode: none
    user: '1000:1000' # the image's node user, never root
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - media_socket:/run/media
      - media_work:/work # inputs and outputs while a run lasts (on disk, not in memory)
    init: true # reaps ffmpeg children and forwards stop signals
    mem_limit: 1536m # three runs at once (each ffmpeg allocation is capped at 256 MiB)
    memswap_limit: 1536m
    pids_limit: 64
    # A share of one CPU: the test server has a single core, and Docker refuses a limit above
    # the host's count. Transcoding then never starves the app.
    cpus: 0.75
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('node:http').get({socketPath:'/run/media/media.sock',path:'/health'},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 5s # a run cut short is retried by the app's job a minute later
    logging: *logging
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]

  postgres:
    image: postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    environment:
      POSTGRES_USER: spolu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: spolu
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U spolu -d spolu']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    logging: *logging
    # The entrypoint starts as root and drops to the postgres user (gosu), which needs these;
    # everything else is dropped.
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]

  caddy:
    image: caddy:2.11.7@sha256:685ae3d7c34d9b5f8caeddc5d14051db7bbd88ff1f5a2fa0c16bd8ca328fb7af
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./redirects.caddy:/etc/caddy/redirects.caddy:ro # written by scripts/deploy.sh
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped
    logging: *logging
    # Caddy runs as root in its image and binds 80 and 443: only that capability is kept.
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]

  backup:
    image: postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    entrypoint: ['bash', '/backup.sh']
    environment:
      PGHOST: postgres
      PGUSER: spolu
      PGDATABASE: spolu
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${BACKUP_TZ:-Europe/Bratislava}
      BACKUP_HOUR: ${BACKUP_HOUR:-03:30}
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      - backups:/backups
      - files:/data/files:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    # Runs as root to write /backups; DAC_READ_SEARCH lets it read every app file whatever its mode.
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]

volumes:
  files:
  media_socket:
  media_work:
  pgdata:
  caddy_data:
  caddy_config:
  backups:
