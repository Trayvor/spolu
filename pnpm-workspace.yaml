packages:
  - apps/*
  - packages/*
# Supply-chain policy (ADR 0037). Keys are pnpm 12's (packageManager in package.json).
# Only these packages may run install scripts; any other package with one fails the install.
allowBuilds:
  esbuild: true
strictDepBuilds: true
# A version must be 7 days old (in minutes) before pnpm installs it: most npm worms are caught
# and unpublished within hours to a few days. An urgent security patch younger than that goes
# into minimumReleaseAgeExclude as `name@version`, with a comment and a date to remove it.
minimumReleaseAge: 10080
# Refuse a version published with weaker trust evidence (provenance, trusted publishing) than an
# earlier version of the same package: the pattern of a stolen npm token.
trustPolicy: no-downgrade
# Exact versions already in the lockfile that the check flags, reviewed 2026-10-18: each was
# published without provenance by the package's usual maintainer after an earlier version had it
# (semver 6.3.1 after 7.x; chokidar 4.0.3; workbox-build's
# @trickfilm400/rollup-plugin-off-main-thread 3.0.0-pre1, build time only, from December 2025).
trustPolicyExclude:
  - 'semver@6.3.1'
  - 'chokidar@4.0.3'
  - '@trickfilm400/rollup-plugin-off-main-thread@3.0.0-pre1'
# Only our own package.json may use git or tarball sources; transitive dependencies come from
# the registry only.
blockExoticSubdeps: true
# Grandfathered: the exact versions of the lockfile of 2026-10-18 (origin/main 09555562) that
# were younger than 7 days when the policy came in. They passed the security review of that day
# (pnpm audit --prod: no known vulnerabilities). The youngest was published on 2026-10-14, so
# this whole list can be deleted on or after 2026-10-22. Do not add ranges here, only
# `name@version` with a comment.
